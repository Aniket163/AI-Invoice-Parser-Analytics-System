services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: invoice_db
      MYSQL_USER: invoice_user
      MYSQL_PASSWORD: invoice_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://invoice_user:invoice_password@db:3306/invoice_db
      SECRET_KEY: change-this-in-production
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
volumes:
  mysql_data:
